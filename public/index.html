<title>Youth Dinner 2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;background:#0E0805;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif}
/* The poster fills a phone's width and shrinks on wider screens so the button stays in view. */
main{width:min(100vw,calc((100vh - 88px)*.8));min-width:min(100vw,320px)}
img{display:block;width:100%;height:auto}
a{display:flex;align-items:center;justify-content:center;min-height:56px;margin:16px;font-size:18px;font-weight:700;color:#1A0E06;text-decoration:none;border-radius:14px;background:linear-gradient(#FFDB5C,#F4B81E)}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="poster.webp" width="2160" height="2700" alt="St. Matthew's Parish Youth Council presents Youth Dinner 2026. Ticket GH₵ 150. A Night of Grace, Gratitude and Celebration. Dress code: Anything Decent! Side attraction: live band performance. On Monday 28th Dec. 2026, 8:00 PM to midnight. Venue: Kosayo Green Hotel, Effiduase, Ashanti Region. Enquiries, tickets and directions: Joseph 054 476 9855, Benjamin 0247500506, Diana 054 113 1901, Mark 0247201041.">
