<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ticket check</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px;background:#120A05;color:#fff}
main.CONFIRMED{background:#0B6B3A}main.SEATED{background:#F7C531;color:#120A05}main.INVALID{background:#9B1C1C}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
h1{font-size:32px;margin:20px 0 10px;line-height:1}main.CONFIRMED h1,main.SEATED h1,main.INVALID h1{font-size:clamp(44px,14vw,84px)}
.detail{font-size:20px;margin:4px 0}.meta{font-size:15px;margin:4px 0}
button{display:none;margin-top:20px;min-height:48px;padding:0 20px;font-size:16px;font-weight:700;border:0;border-radius:8px;background:#F7C531;color:#120A05}
</style>
</head>
<body>
<main id="result" role="status" aria-live="polite">
  <div class="eyebrow">St. Matthew Parish Youth Dinner 2026</div>
  <h1 id="word">Checking ticket…</h1>
  <p id="detail" class="detail"></p>
  <p id="meta" class="meta"></p>
  <button id="again" type="button">Try again</button>
</main>
<script>
const $ = (id) => document.getElementById(id);
// A malformed link must show INVALID, not leave the page stuck on "Checking ticket…".
const token = (() => {
  try { return decodeURIComponent(location.pathname.split('/t/')[1] || '').replace(/\/$/, ''); } catch { return ''; }
})();
const when = (iso) => new Date(iso).toLocaleString('en-GB', { timeZone: 'Africa/Accra', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' });
function show(kind, word, detail, meta) {
  $('result').className = kind;
  $('word').textContent = word;
  $('detail').textContent = detail;
  $('meta').textContent = meta;
}
// The scan is recorded by this script, so link previews and bots that only fetch the page do not count.
async function check() {
  $('again').style.display = 'none';
  show('', 'Checking ticket…', '', '');
  try {
    const res = await fetch('/api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
    if (!res.ok) throw new Error(res.status);
    const r = await res.json();
    if (!r.ok) return show('INVALID', 'INVALID', 'This code is not a Youth Dinner ticket.', '');
    show(r.status, r.status, `Ticket ${r.ticket}`, `Scan ${r.scans} · ${when(r.at)}`);
  } catch {
    show('', 'Could not check ticket', '', 'Check the connection and try again.');
    $('again').style.display = 'inline-block';
  }
}
$('again').addEventListener('click', check);
check();
</script>
</body>
</html>
